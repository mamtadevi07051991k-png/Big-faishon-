<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e83e70"><meta name="description" content="Discover fashion, new arrivals and everyday essentials at The Big Fashion."><title>The Big Fashion | Discover your style</title><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><script defer src="js/products.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabase-config.js"></script><script defer src="js/supabase-client.js"></script><script defer src="js/app.js"></script></head><body><div id="app"><main style="max-width:520px;margin:18vh auto;padding:28px 22px;text-align:center;font-family:Arial,sans-serif;color:#222"><h2 style="margin:0 0 10px">THE BIG FASHION</h2><p>Store is loading…</p></main></div><noscript>Please enable JavaScript to use The Big Fashion storefront.</noscript><script>
(function(){
  var app=document.getElementById('app');
  function showFailure(message){
    if(!app || app.dataset.ready==='1') return;
    app.innerHTML='<main style="max-width:560px;margin:12vh auto;padding:28px 22px;text-align:center;font-family:Arial,sans-serif;color:#222"><h2>THE BIG FASHION</h2><p style="color:#a33">The store could not finish loading.</p><p style="font-size:13px;color:#666">'+String(message||'Please refresh the page.').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})+'</p><button onclick="location.reload()" style="padding:12px 22px;border:0;border-radius:8px;background:#222;color:white">Retry</button></main>';
  }
  window.addEventListener('error',function(e){showFailure(e.message||'A script failed to load.');});
  window.addEventListener('unhandledrejection',function(e){showFailure(e.reason&&e.reason.message||'A store request failed.');});
  window.setTimeout(function(){if(app && !app.querySelector('header') && !app.querySelector('.splash')) showFailure('The storefront did not start. Check the Vercel deployment root and browser console.');},12000);
})();
</script></body></html>
